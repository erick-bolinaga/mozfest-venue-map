<title>Recinte Fabra i Coats — 3D</title>
<!-- The theme, decided before anything paints: the saved choice if there is
     one, else the system's. The same rule reaches the 3D later, in
     interfaz.js; this only spares the flash of the wrong theme while 1.4 MB
     of script parses. The attribute on <html> above is what stands with
     scripts off. -->
<script>
try{ var temaGuardado = localStorage.getItem('mozfest-theme'); }catch(e){}
document.documentElement.dataset.theme =
  temaGuardado === 'light' || (!temaGuardado && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
</script>
